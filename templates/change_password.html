{% extends "base.html" %}
{% block title %}Change password - UpdateIP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3"><i class="bi bi-shield-lock me-1"></i>Choose your own password</h5>
        <div class="alert alert-warning">You signed in with the default password. Set your own password now to continue.</div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">New password (at least 8 characters)</label>
            <input type="password" name="new_password" class="form-control" required minlength="8" autofocus autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label">Repeat new password</label>
            <input type="password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Save password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
